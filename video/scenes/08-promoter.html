<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>The Care Promoter — Astria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shared.css">
<meta name="duration" content="20">
<script>if(location.search.indexOf("snap")>-1)document.documentElement.className="snap";</script>
</head><body class="">

<div class="stage">
  <div class="eyebrow fx" style="--d:150ms">The human model</div>
  <h2 class="fx" style="--d:450ms;margin:24px 0 12px">Every member gets a Care Promoter</h2>
  <div class="sub fx" style="--d:900ms;max-width:52ch">A community health worker who knows each member,
    their care plan, and the realities shaping their health.</div>

  <div style="position:relative;display:flex;align-items:center;justify-content:center;gap:0;
       margin-top:54px;height:520px">
    <div style="display:flex;flex-direction:column;gap:42px;align-items:flex-end;width:430px">
      <div class="chip green fx" style="--d:6400ms;font-size:23px;padding:16px 26px"><span class="dot"></span>Behavioral health</div><div class="chip green fx" style="--d:7440ms;font-size:23px;padding:16px 26px"><span class="dot"></span>Substance-use treatment</div><div class="chip green fx" style="--d:8480ms;font-size:23px;padding:16px 26px"><span class="dot"></span>Housing</div>
    </div>

    <svg width="560" height="520" style="overflow:visible;margin:0 10px">
      <path class="draw" style="--d:6200ms;--len:360;--dur:900ms" d="M0 92 C 90 92, 110 240, 200 240" stroke="#2E4068" stroke-width="2" fill="none"/><path class="draw" style="--d:6700ms;--len:360;--dur:900ms" d="M560 92 C 470 92, 450 240, 360 240" stroke="#2E4068" stroke-width="2" fill="none"/><path class="draw" style="--d:7240ms;--len:360;--dur:900ms" d="M0 240 C 90 240, 110 240, 200 240" stroke="#2E4068" stroke-width="2" fill="none"/><path class="draw" style="--d:7740ms;--len:360;--dur:900ms" d="M560 240 C 470 240, 450 240, 360 240" stroke="#2E4068" stroke-width="2" fill="none"/><path class="draw" style="--d:8280ms;--len:360;--dur:900ms" d="M0 388 C 90 388, 110 240, 200 240" stroke="#2E4068" stroke-width="2" fill="none"/><path class="draw" style="--d:8780ms;--len:360;--dur:900ms" d="M560 388 C 470 388, 450 240, 360 240" stroke="#2E4068" stroke-width="2" fill="none"/>
    </svg>

    <div style="display:flex;flex-direction:column;gap:42px;align-items:flex-start;width:430px">
      <div class="chip green fx" style="--d:6920ms;font-size:23px;padding:16px 26px"><span class="dot"></span>Transportation</div><div class="chip green fx" style="--d:7960ms;font-size:23px;padding:16px 26px"><span class="dot"></span>Food access</div><div class="chip green fx" style="--d:9000ms;font-size:23px;padding:16px 26px"><span class="dot"></span>Primary care</div>
    </div>

    <div class="pop" style="--d:2600ms;position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
         text-align:center">
      <div class="card" style="padding:30px 44px;background:#16233A;border:1px solid #2E4068">
        <div style="font-size:29px;font-weight:700;color:#fff;font-family:var(--display)">Care Promoter</div>
        <div class="label" style="font-size:20px;margin-top:6px">knows the member</div>
      </div>
    </div>
    <svg style="position:absolute;left:50%;top:46%;transform:translateX(-50%);width:8px;height:170px;
         overflow:visible;pointer-events:none">
      <path class="draw" style="--d:4200ms;--len:160;--dur:900ms" d="M4 54 L4 150"
            stroke="#2E4068" stroke-width="2" fill="none"/>
    </svg>
    <div class="pop" style="--d:4900ms;position:absolute;left:50%;top:calc(46% + 160px);
         transform:translate(-50%,0)">
      <div class="chip" style="font-size:23px"><span class="dot"></span>Member</div>
    </div>
  </div>
</div>
</body></html>
