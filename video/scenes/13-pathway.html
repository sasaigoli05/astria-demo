<div class="stage">
  <div class="eyebrow fx" style="--d:150ms">Our pathway is deliberate</div>
  <div style="display:flex;flex-direction:column;gap:62px;margin-top:62px">
  <div class="fx" style="--d:1400ms;display:flex;gap:34px;align-items:flex-start;max-width:1180px">
    <div class="wordmark" style="font-size:40px;color:#E8B85B;min-width:80px">01</div>
    <div><div style="font-size:40px;font-weight:700;color:#fff;font-family:var(--display)">Start with one established network</div>
      <div class="label" style="margin-top:8px">where the model already works</div></div>
  </div>
  <div class="fx" style="--d:3100ms;display:flex;gap:34px;align-items:flex-start;max-width:1180px">
    <div class="wordmark" style="font-size:40px;color:#E8B85B;min-width:80px">02</div>
    <div><div style="font-size:40px;font-weight:700;color:#fff;font-family:var(--display)">Validate in communities with the greatest need</div>
      <div class="label" style="margin-top:8px">rural and under-served counties</div></div>
  </div>
  <div class="fx" style="--d:4800ms;display:flex;gap:34px;align-items:flex-start;max-width:1180px">
    <div class="wordmark" style="font-size:40px;color:#E8B85B;min-width:80px">03</div>
    <div><div style="font-size:40px;font-weight:700;color:#fff;font-family:var(--display)">Expand across North Carolina</div>
      <div class="label" style="margin-top:8px">and eventually beyond it</div></div>
  </div></div>
  <svg width="1180" height="60" style="margin-top:56px;overflow:visible">
    <path class="draw" style="--d:7000ms;--len:1250;--dur:2600ms"
          d="M40 40 C 340 40, 420 14, 620 14 C 840 14, 920 -10, 1130 -10"
          stroke="#AABEF5" stroke-width="2.6" fill="none"/>
    <circle class="pop" style="--d:7200ms" cx="40" cy="40" r="9" fill="#4776E6"/>
    <circle class="pop" style="--d:8400ms" cx="620" cy="14" r="9" fill="#4776E6"/>
    <circle class="bloom" style="--d:9600ms" cx="1130" cy="-10" r="11" fill="#E8B85B"/>
  </svg>
</div>
